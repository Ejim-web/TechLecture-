<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TechLecture | AI Learning Platform</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

</head>


<body>


<div class="app">


<header class="header">

<div class="logo">
<i class="fa-solid fa-graduation-cap"></i>
TechLecture
</div>


<div class="actions">

<button class="btn" id="loginBtn">
<i class="fa-solid fa-user"></i>
Login
</button>


<button class="btn" id="themeBtn">
<i class="fa-solid fa-moon"></i>
</button>

</div>


</header>





<section class="hero">


<h1>
Learn Technology With 
<span>AI</span>
</h1>


<p>
Programming, Cybersecurity, Artificial Intelligence,
Cloud Computing and more.
</p>


<button class="primary">
Start Learning
</button>


</section>





<div class="search-box">


<input id="searchInput"
placeholder="Search courses...">


<button id="searchBtn">
<i class="fa fa-search"></i>
</button>


</div>





<div id="categories"
class="categories">

</div>






<section>


<h2>
<i class="fa-solid fa-star"></i>
Featured Courses
</h2>


<div id="courses"
class="grid">


</div>


</section>







<section id="dashboard"
class="dashboard hidden">


<h2>
<i class="fa-solid fa-chart-line"></i>
Dashboard
</h2>



<div class="dashboard-grid">


<div class="stat-card">

<h3 id="courseCount">
0
</h3>

<p>
Courses
</p>

</div>


<div class="stat-card">

<h3 id="progressCount">
0%
</h3>

<p>
Progress
</p>

</div>


<div class="stat-card">

<h3 id="certificateCount">
0
</h3>

<p>
Certificates
</p>

</div>


</div>


</section>







<section class="ai-section">


<h2>
<i class="fa-solid fa-robot"></i>
AI Tutor
</h2>


<div class="ai-box">


<div id="aiMessages">

<p>
AI Tutor ready.
</p>


</div>



<div class="ai-input">


<input id="aiInput"
placeholder="Ask a technology question">


<button id="sendAI"
class="primary">

Send

</button>


</div>


</div>


</section>








<section class="certificate">


<h2>
<i class="fa-solid fa-certificate"></i>
Certificate Verification
</h2>



<input id="certificateID"
placeholder="Certificate ID">


<button id="verifyCertificate"
class="primary">

Verify

</button>


<p id="certificateResult"></p>


</section>








<section id="adminPanel"
class="admin hidden">


<h2>
<i class="fa-solid fa-lock"></i>
Admin Panel
</h2>



<input id="courseName"
placeholder="Course title">


<input id="courseCategory"
placeholder="Category">


<textarea id="courseDescription"
placeholder="Description"></textarea>


<input id="courseImage"
placeholder="Image URL">


<input id="courseLink"
placeholder="Course URL">



<button id="addCourse"
class="primary">

Add Course

</button>



<div id="adminCourses">

</div>


</section>









<!-- LOGIN MODAL -->


<div id="authModal"
class="modal hidden">


<div class="modal-box">


<h2>
Login
</h2>


<input id="email"
type="email"
placeholder="Email">


<input id="password"
type="password"
placeholder="Password">



<button id="emailLogin"
class="primary">

Login / Signup

</button>




<button onclick="googleLogin()"
class="btn">

<i class="fa-brands fa-google"></i>
Google

</button>




<button onclick="githubLogin()"
class="btn">

<i class="fa-brands fa-github"></i>
GitHub

</button>



<button id="closeModal"
class="btn">

Close

</button>



</div>

</div>









<!-- COURSE MODAL -->


<div id="courseModal"
class="modal hidden">


<div class="modal-box">


<h2 id="courseTitle"></h2>


<p id="courseDescription"></p>



<a id="courseLink"
target="_blank"
class="primary">

Open Course

</a>



<button id="closeCourse"
class="btn">

Close

</button>


</div>


</div>







<footer>

<p>
© 2026 TechLecture
</p>

</footer>



</div>





<script src="app.js"></script>


</body>
</html>
